<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="abuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142E2C" />
      <stop offset="52%" stop-color="#294A48" />
      <stop offset="100%" stop-color="#5B827C" />
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F5A" />
      <stop offset="100%" stop-color="#FF6B1A" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    <filter id="glowShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1C1B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Main Rounded Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#abuBg)" />

  <!-- Ambient Orbs -->
  <circle cx="410" cy="102" r="120" fill="#FF8A3D" opacity="0.24" />
  <circle cx="96" cy="400" r="140" fill="#89B3AC" opacity="0.22" />

  <!-- Glassmorphic Inner Frame -->
  <rect x="38" y="38" width="436" height="436" rx="92" fill="url(#glassCard)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" />

  <!-- ABÜ Top Orange Pill Badge -->
  <rect x="176" y="64" width="160" height="44" rx="22" fill="url(#amberAccent)" filter="url(#glowShadow)" />
  <text x="256" y="93" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="23" letter-spacing="1.5" fill="#FFFFFF">
    ★ ABÜ ★
  </text>

  <!-- Fun Mascot / Owl + Graduation Cap Character -->
  <g filter="url(#glowShadow)">
    <!-- Mascot Body / Face Shield -->
    <rect x="156" y="148" width="200" height="156" rx="76" fill="#F4F9F8" stroke="#FF8A3D" stroke-width="6" />
    <!-- Cute Ears / Cap Corners -->
    <polygon points="256,108 386,154 256,196 126,154" fill="#142E2C" stroke="#FFFFFF" stroke-width="4" />
    <!-- Cap Tassel -->
    <path d="M256,152 L352,174 L352,226" fill="none" stroke="#FF8A3D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="352" cy="230" r="12" fill="#FF8A3D" />

    <!-- Happy Eyes & Smile -->
    <circle cx="214" cy="224" r="16" fill="#142E2C" />
    <circle cx="219" cy="219" r="5" fill="#FFFFFF" />
    <circle cx="298" cy="224" r="16" fill="#142E2C" />
    <circle cx="303" cy="219" r="5" fill="#FFFFFF" />

    <!-- Rosy Cheeks -->
    <ellipse cx="188" cy="244" rx="13" ry="8" fill="#FF8A3D" opacity="0.45" />
    <ellipse cx="324" cy="244" rx="13" ry="8" fill="#FF8A3D" opacity="0.45" />

    <!-- Cheerful Smile / Beak -->
    <path d="M238,242 Q256,262 274,242" fill="none" stroke="#FF6B1A" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Bottom Floating Pill Bar with Camp'Us -->
  <rect x="68" y="330" width="376" height="98" rx="49" fill="#142E2C" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" filter="url(#glowShadow)" />
  <text x="256" y="393" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="54" letter-spacing="-1" fill="#FFFFFF">
    Camp<tspan fill="#FF8A3D">’</tspan><tspan fill="#89B3AC">Us</tspan>
  </text>
</svg>
