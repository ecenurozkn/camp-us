<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="52%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Full bleed background for maskable & iOS icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Decorative ambient circles -->
  <circle cx="96" cy="96" r="140" fill="#FFFFFF" opacity="0.08" />
  <circle cx="430" cy="410" r="160" fill="#38BDF8" opacity="0.16" />

  <!-- Frosted inner badge -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="url(#cardGlow)" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3" />

  <!-- Sparkle stars -->
  <path d="M402 104 L410 124 L430 132 L410 140 L402 160 L394 140 L374 132 L394 124 Z" fill="url(#accentGold)" />
  <circle cx="118" cy="134" r="8" fill="#A5F3FC" opacity="0.9" />

  <!-- Modern Graduation Cap + Campus Hub Emblem -->
  <g filter="url(#softShadow)">
    <!-- Cap Top Diamond -->
    <polygon points="256,96 392,158 256,220 120,158" fill="#FFFFFF" />
    <polygon points="256,108 370,158 256,208 142,158" fill="#EEF2FF" />

    <!-- Cap Skullcap / Base -->
    <path d="M172,188 L172,244 C172,272 208,294 256,294 C304,294 340,272 340,244 L340,188 L256,226 Z" fill="#E0E7FF" />

    <!-- Social connection nodes inside cap base -->
    <circle cx="222" cy="248" r="11" fill="#4F46E5" />
    <circle cx="256" cy="256" r="13" fill="#0EA5E9" />
    <circle cx="290" cy="248" r="11" fill="#4F46E5" />

    <!-- Tassel -->
    <path d="M256,158 L358,182 L358,242" fill="none" stroke="url(#accentGold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="256" cy="158" r="9" fill="url(#accentGold)" />
    <circle cx="358" cy="246" r="12" fill="url(#accentGold)" />
  </g>

  <!-- Pill container for Camp'Us Wordmark -->
  <rect x="76" y="328" width="360" height="94" rx="47" fill="#FFFFFF" filter="url(#softShadow)" />

  <!-- Camp'Us Text -->
  <text x="256" y="391" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="56" letter-spacing="-1.5" fill="#1E1B4B">
    Camp<tspan fill="#4F46E5">’</tspan><tspan fill="#0284C7">Us</tspan>
  </text>
</svg>
